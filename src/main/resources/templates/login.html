<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head}"></head>
<body>
<div class="login-caja">
    <h1>🚀 CursoMania</h1>
    <p class="lema">Aprende. Crece. Domina.</p>

    <p class="aviso aviso-error" th:if="${param.error}">Usuario o contraseña incorrectos</p>
    <p class="aviso" th:if="${param.logout}">Has cerrado sesión correctamente</p>

    <form th:action="@{/login}" method="post">
        <div class="campo">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn">Ingresar</button>
    </form>

    <div class="aviso" style="margin-top:20px; text-align:left">
        <strong>Usuarios de prueba</strong><br>
        Administrador: <code>admin</code> / <code>admin123</code><br>
        Usuario: <code>user</code> / <code>user123</code>
    </div>
</div>
</body>
</html>
